<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>Crear cuenta</h1>
      <p>Registrate en Cine Progra IV</p>
    </div>

    <form (ngSubmit)="register()">

      <div class="form-group">
        <label for="firstName">Nombre</label>

        <input
          id="firstName"
          class="form-control"
          type="text"
          name="firstName"
          [(ngModel)]="firstName"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="form-group">
        <label for="lastName">Apellido</label>

        <input
          id="lastName"
          class="form-control"
          type="text"
          name="lastName"
          [(ngModel)]="lastName"
          placeholder="Tu apellido"
          required
        />
      </div>

      <div class="form-group">
        <label for="birthDate">Fecha de nacimiento</label>

        <input
          id="birthDate"
          class="form-control"
          type="date"
          name="birthDate"
          [(ngModel)]="birthDate"
          required
        />
      </div>

      <div class="form-group">
        <label for="bloodType">Tipo de sangre</label>

        <select
          id="bloodType"
          class="form-control"
          name="bloodType"
          [(ngModel)]="bloodType"
          required
        >
          <option value="">Seleccioná tu tipo de sangre</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <div class="form-group">
        <label for="eyeColor">Color de ojos</label>

        <input
          id="eyeColor"
          class="form-control"
          type="text"
          name="eyeColor"
          [(ngModel)]="eyeColor"
          placeholder="Ej: marrón, azul, verde"
          required
        />
      </div>

      <div class="form-group">
        <label for="vacationDays">Días de vacaciones por año</label>

        <input
          id="vacationDays"
          class="form-control"
          type="number"
          name="vacationDays"
          [(ngModel)]="vacationDays"
          min="0"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          class="form-control"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          id="password"
          class="form-control"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          minlength="6"
          required
        />
      </div>

      @if (error) {
        <div class="alert alert-danger">
          {{ error }}
        </div>
      }

      @if (message) {
        <div class="alert alert-success">
          {{ message }}
        </div>
      }

      <button
        class="btn btn-primary auth-submit"
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>
        ¿Ya tenés una cuenta?
        <a routerLink="/login">Ingresar</a>
      </p>
    </div>
  </div>
</div>
