<div class="auth-page">
  <div class="auth-card card">

    <div class="auth-header">
      <h1>Ingresar</h1>
      <p>Ingresá a tu cuenta de Cine Progra IV</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          class="form-control"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          id="password"
          class="form-control"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Tu contraseña"
          required
        />
      </div>

      @if (error) {
        <div class="alert alert-danger">
          {{ error }}
        </div>
      }

      <button
        class="btn btn-primary auth-submit"
        type="submit"
        [disabled]="loading || oauthLoading"
      >
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

    </form>

    <div class="auth-divider">
      <span>o continuar con</span>
    </div>

    <div class="oauth-buttons">

      <button
        class="oauth-btn oauth-google"
        type="button"
        (click)="loginWithGoogle()"
        [disabled]="loading || oauthLoading"
      >
        <span class="oauth-icon google-icon">G</span>

        <span class="oauth-text">
          {{
            oauthLoading === 'google'
              ? 'Conectando...'
              : 'Continuar con Google'
          }}
        </span>
      </button>

      <button
        class="oauth-btn oauth-github"
        type="button"
        (click)="loginWithGitHub()"
        [disabled]="loading || oauthLoading"
      >
        <span class="oauth-icon github-icon">GH</span>

        <span class="oauth-text">
          {{
            oauthLoading === 'github'
              ? 'Conectando...'
              : 'Continuar con GitHub'
          }}
        </span>
      </button>

    </div>

    <div class="guest-access">
      <span>¿Solo querés mirar la cartelera?</span>

      <button
        type="button"
        class="guest-btn"
        (click)="continueAsGuest()"
      >
        Continuar como invitado
      </button>
    </div>

    <div class="auth-footer">
      <p>
        ¿No tenés una cuenta?
        <a routerLink="/register">Registrate</a>
      </p>
    </div>

  </div>
</div>
