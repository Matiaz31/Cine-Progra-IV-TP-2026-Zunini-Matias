<div class="empleado-page">

  <div class="empleado-card">

    <div class="empleado-header">
      <h1>Control de acceso</h1>

      <p>
        Escaneá el código QR del ticket o ingresalo manualmente.
      </p>
    </div>

    <div class="scanner-section">

      @if (scannerActivo) {
        <div class="scanner-container">

          <video
            #video
            class="scanner-video"
            autoplay
            muted
            playsinline
          ></video>

          <div class="scanner-frame"></div>

        </div>

        <button
          type="button"
          class="scanner-stop"
          (click)="detenerScanner()"
        >
          Detener cámara
        </button>
      }

      @if (!scannerActivo) {
        <button
          type="button"
          class="scanner-start"
          (click)="iniciarScanner()"
          [disabled]="loading"
        >
          📷 Escanear QR con cámara
        </button>
      }

    </div>

    <div class="qr-section">

      <label for="qrCode">
        Código QR
      </label>

      <input
        id="qrCode"
        type="text"
        [(ngModel)]="qrCode"
        placeholder="Ingresá el código manualmente"
        [disabled]="loading"
      />

    </div>

    <div class="empleado-actions">

      <button
        type="button"
        (click)="validarEntrada()"
        [disabled]="loading || !qrCode.trim()"
      >
        Validar entrada
      </button>

      <button
        type="button"
        (click)="retirarCandyBar()"
        [disabled]="loading || !qrCode.trim()"
      >
        Retirar Candy Bar
      </button>

    </div>

    @if (success) {
      <p class="success">
        {{ success }}
      </p>
    }

    @if (error) {
      <p class="error">
        {{ error }}
      </p>
    }

  </div>

</div>
