<div class="empleado-page">

  <div class="empleado-card">

    <h1>Control de acceso</h1>

    <p>
      Ingresá o escaneá el código QR del ticket.
    </p>

    <input
      type="text"
      [(ngModel)]="qrCode"
      placeholder="Código QR"
      [disabled]="loading"
    />

    <div class="empleado-actions">

      <button
        type="button"
        (click)="validarEntrada()"
        [disabled]="loading"
      >
        Validar entrada
      </button>

      <button
        type="button"
        (click)="retirarCandyBar()"
        [disabled]="loading"
      >
        Retirar Candy Bar
      </button>

    </div>

    @if (success) {
      <p class="success">
        {{ success }}
      </p>
    }

    @if (error) {
      <p class="error">
        {{ error }}
      </p>
    }

  </div>

</div>
